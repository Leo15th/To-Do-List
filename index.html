<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
    <meta name="description" content="To Do List" />
    <title>To Do List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <!-- draw svg for orange background -->
      <svg
        id="header-svg"
        xmlns="http://www.w3.org/2000/svg"
        preserveAspectRatio="none"
        viewBox="0 0 500 200"
      >
        <polygon
          stroke="none"
          fill="currentColor"
          stroke-width="1"
          points="0,0 500,0 500,180 250,200 0,180"
        />
      </svg>
      <!-- title of the page -->
      <h1>To-Do List</h1>
      <!-- description of the page -->
      <p>Stay Organized and productive!</p>
    </header>

    <!-- main contents will go here -->
    <main>
      <!-- input section to handle the input task -->
      <section id="inputSection">
        <!-- make form for input task -->
        <form>
          <!-- label for new task -->
          <label for="input-task">NewTask:</label>
          <div>
            <!-- input element to put task -->
            <input
              id="input-task"
              type="text"
              required
              placeholder="Add a new task..."
              autocomplete="off"
              maxlength="50"
            />
            <!-- button element to submit task -->
            <button id="add-task-btn" type="submit">Add Task</button>
          </div>
        </form>
      </section>
      <!-- horizontal line for divide section -->
      <hr />

      <!-- tasks section to handle tasks -->
      <section id="tasks-section" aria-label="Task List">
        <!-- section header -->
        <h2>Tasks</h2>
        <!-- unorderlist for task holder -->
        <ul>
          <!-- tasks will go here and control with js -->
        </ul>
      </section>
    </main>
    <footer>
      <p>
        Made with Love by Phyo Wai Aung
      </p>
    </footer>

    <div id="popupBox">
      <form>
        <label for="popupInput">Edit Task...</label>
        <input
          type="text"
          name="popupInput"
          id="popupInput"
          required
          autocomplete="off"
          maxlength="50"
        />
        <div>
          <button id="save-edit-btn" type="button">Save</button>
          <button id="cancel-edit-btn" type="button">Cancel</button>
        </div>
      </form>
    </div>

    <script src="script.js"></script>
  </body>
</html>
