<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav>This will be the nav bar</nav>

    <section id="displaySection">
      <div id="display">
        <h1>To Do List</h1>
        <ul id="tasksContainer">
          <!-- js code will goes here -->
        </ul>
      </div>
      <div id="addTaskBtnContainer">
        <button id="addTaskBtn">Add Task</button>
      </div>
    </section>

    <section id="inputTextBoxSection">
      <div id="inputTextBoxDiv">
        <button id="inputTextBoxSectionCloseBtn">Close</button>
        <h2>Enter Task</h2>
        <input type="text" name="inputTask" id="inputTask" autocomplete="off" />
        <button id="addBtn">Add</button>
        <button id="saveBtn">Save</button>
      </div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
