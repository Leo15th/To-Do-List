<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <input type="text" placeholder="Text something" id="inputText" />
    <button id="saveBtn">Save</button>
    <button id="loadBtn">Load</button>
    <p id="output"></p>
    <script>
      const saveBtn = document.getElementById("saveBtn");
      const loadBtn = document.getElementById("loadBtn");
      const inputTextBox = document.getElementById("inputText");

      saveBtn.addEventListener("click", () => {
        const inputText = inputTextBox.value;
        localStorage.setItem("text", inputText);
      });
      loadBtn.addEventListener("click", () => {
        const saveText = localStorage.getItem("text");
        document.getElementById("output").innerHTML = saveText;
      });
    </script>
  </body>
</html>
